[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "orchestrator*", "api*", "config*", "evaluation*", "thesis_pipeline*"]

[project]
name = "multi-agent-medical"
version = "0.1.0"
description = "Multi-agent framework for medical document assessment"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "openai>=1.99.0",
    "httpx>=0.27.0,<1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "truststore>=0.10.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
evaluation = [
    "numpy>=2.0.0",
    "anthropic>=0.40.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
    "nbformat>=5.10.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "PyYAML>=6.0",
]
# Only needed to regenerate docs/System-Documentation.{docx,pdf}
docs = [
    "python-docx>=1.1.0",
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
